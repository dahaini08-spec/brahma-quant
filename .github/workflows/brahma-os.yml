name: brahma-os
on:
  push:
    paths:
      - "brahma_os/**"
      - "tests/test_brahma_os.py"
      - "tests/test_brahma_os_sim.py"
      - "scripts/paper_engine.py"
      - "scripts/brahma_os_validate.py"
  pull_request:
    paths:
      - "brahma_os/**"
      - "tests/test_brahma_os.py"
      - "tests/test_brahma_os_sim.py"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: pytest tests/test_brahma_os.py tests/test_brahma_os_sim.py -q
